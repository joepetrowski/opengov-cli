name: Rust

# Cancel a currently running workflow from the same PR, branch or tag when a new workflow is
# triggered (ref https://stackoverflow.com/a/72408109)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  # Used by the `wasm` job and by release.yml, so that the published package is built by the same
  # version that CI tests.
  WASM_PACK_VERSION: 0.15.1
  # Nightly is needed for the unstable options in rustfmt.toml.
  TOOLCHAIN_LINT: nightly-2026-10-29

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          SKIP_WASM_BUILD: 1
        run: cargo build --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Increase swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN_LINT }}
          components: rustfmt, clippy

      - name: Fmt
        run: cargo +${{ env.TOOLCHAIN_LINT }} fmt --all -- --check

      # The library and its test build each take about 10 GB to compile. Checking the library first
      # keeps the two from compiling at the same time, which needs more memory than a runner has.
      - name: Clippy (library and binary)
        env:
          SKIP_WASM_BUILD: 1
        run: cargo +${{ env.TOOLCHAIN_LINT }} clippy --all-features -- -D warnings

      - name: Clippy (all targets)
        env:
          SKIP_WASM_BUILD: 1
        run: cargo +${{ env.TOOLCHAIN_LINT }} clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the library before its tests, so that the two do not compile at the same time (see the
      # lint job).
      - name: Build
        run: cargo build --all-features --verbose
      - name: Run tests
        run: cargo test --all-features --verbose

  # Build the library for the browser and check that the package works from JavaScript.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the wasm target and wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked --version ${{ env.WASM_PACK_VERSION }}
      - name: Build the wasm package
        run: wasm-pack build --target web --no-default-features --features wasm
      - name: Smoke test
        run: node scripts/wasm-smoke-test.mjs pkg
      - name: Pack
        run: wasm-pack pack
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: pkg/*.tgz
          if-no-files-found: error
